<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Account access | Gryn Index</title><style>body{background:#f2f0f6;font:16px Arial;color:#30223d;margin:0}main{max-width:420px;margin:8vh auto;background:white;padding:32px;border-radius:16px}label,input,button{display:block;width:100%;box-sizing:border-box}input,button{padding:14px;margin:10px 0 20px;border:1px solid #c9bfd3;border-radius:8px}button{background:#633782;color:white;cursor:pointer}a{color:#633782}p{line-height:1.6}</style></head><body><main><h2>Gryn Index Initiative</h2><h1 id="title">Reset your password</h1><p>Use your registered email address to recover access.</p><form id="reset"></form><p id="status" role="status"></p><a id="signInLink" href="/">Back to sign in</a></main><script type="module">
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);const form=document.querySelector('form');form.innerHTML=token?'<label>New password<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>Confirm new password<input name="confirmPassword" type="password" autocomplete="new-password" required></label><p>Use 12–128 characters, including uppercase, lowercase and a number.</p><button>Save new password</button>':'<label>Email address<input name="email" type="email" autocomplete="email" required></label><button>Email reset link</button>';form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;try{const response=await fetch('/api/gryn/reset-access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...Object.fromEntries(new FormData(form)),token})});const data=await response.json();if(!response.ok)throw Error(data.error);document.querySelector('#status').textContent=data.message;if(token){form.reset();form.hidden=true;if(['/','/admin_login','/staff_login'].includes(data.signInPath))document.querySelector('#signInLink').href=data.signInPath;}}catch(e){document.querySelector('#status').textContent=e.message;}finally{button.disabled=false;}};
</script></body></html>
